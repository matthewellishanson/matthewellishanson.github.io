<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucks Lineup Tree</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .node circle {
      fill: #00471B;
      stroke: #FDBB30;
      stroke-width: 2px;
    }
    .node text {
      font-size: 12px;
    }
    .tooltip {
      position: absolute;
      text-align: left;
      padding: 8px;
      font-size: 12px;
      background: white;
      border: 1px solid #ccc;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>Bucks Lineup Combinations (Net Rating Impact Without Giannis)</h2>
  <div id="tree"></div>

  <script>
    const data = {
      name: "G. Antetokounmpo | A. Green | R. Rollins | M. Turner",
      net: 10.6,
      minutes: 214,
      children: [
        {
          name: "A. Green | R. Rollins | M. Turner",
          net: 4.5,
          minutes: 296,
          children: [
            {
              name: "R. Rollins | M. Turner",
              net: 0.5,
              minutes: 165
            }
          ]
        },
        {
          name: "G. Antetokounmpo | R. Rollins | M. Turner",
          net: 9.1,
          minutes: 243
        },
        {
          name: "G. Antetokounmpo | A. Green | M. Turner",
          net: 10.6,
          minutes: 242
        }
      ]
    };

    const width = 900;
    const dx = 20;
    const dy = 280;
    const margin = { top: 20, right: 120, bottom: 20, left: 100 };

    const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

    const tree = d3.tree().nodeSize([dx, dy]);
    const root = d3.hierarchy(data);
    root.x0 = 0;
    root.y0 = 0;
    tree(root);

    const svg = d3.select("#tree")
      .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", 500)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const gLink = svg.append("g").attr("fill", "none").attr("stroke", "#ccc").attr("stroke-width", 1.5);
    const gNode = svg.append("g");

    const link = gLink.selectAll("path").data(root.links()).join("path").attr("d", diagonal);

    const node = gNode.selectAll("g").data(root.descendants()).join("g")
      .attr("transform", d => `translate(${d.y},${d.x})`);

    node.append("circle")
      .attr("r", d => 4 + Math.sqrt(d.data.minutes) / 10)
      .attr("fill", d => d.data.name.includes("Antetokounmpo") ? "#00471B" : "#bbb")
      .attr("stroke", "#FDBB30");

    node.append("text")
      .attr("dy", "0.31em")
      .attr("x", 10)
      .text(d => `${d.data.name} (${d.data.net > 0 ? "+" : ""}${d.data.net})`);
  </script>
</body>
</html>
